<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#bcd9ea;color:#2a1f18;font-family:'IBM Plex Sans',sans-serif}a{color:#2a1f18}a:hover{color:#8a4a22}</style>
<script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
<script src="./block-kit.js"></script>
<script src="./stud-kit.js"></script>
<script src="./forest-1stud.js"></script>
<script src="./forest-corner.js"></script>
<script src="./classic-kit.js"></script>
<script src="./plateau-blockout.js"></script>
<script src="./plateau-temple.js"></script>
<script src="./coast-blockout.js"></script>
<script src="./coast-keyspots.js"></script>
<script src="./coast-dressing.js"></script>
<script src="./coast-v2.js"></script>
<script src="./plateau-props.js"></script>
<script src="./plateau-dressing.js"></script>
</helmet>
<div style="position:relative;width:100%;height:100vh;min-height:520px;overflow:hidden;background:#bcd9ea">
  <div ref="{{ hostRef }}" style="position:absolute;inset:0;cursor:grab;touch-action:none"></div>
  <div style="position:absolute;top:20px;left:24px;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:55%">
    <div style="font-size:20px;font-weight:600;letter-spacing:-0.01em">Sandy Plateau · Final</div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#5e4636">{{ info }}</div>
  </div>
  <div style="position:absolute;top:20px;right:24px;display:flex;gap:8px">
    <button onClick="{{ dl }}" style="font:500 13px 'IBM Plex Sans',sans-serif;padding:9px 14px;border-radius:6px;border:1px solid #2a1f18;background:transparent;color:#2a1f18;cursor:pointer" style-hover="background:#2a1f18;color:#e8c7a4">SandPlateau.rbxmx ↓</button>
  </div>
  <div style="position:absolute;left:24px;right:24px;bottom:20px;display:flex;flex-wrap:wrap;gap:12px">
    <div style="display:flex;flex-wrap:wrap;gap:2px;padding:2px;background:#d9b590;border-radius:6px">
      <sc-for list="{{ views }}" as="v" hint-placeholder-count="6">
        <button onClick="{{ v.go }}" style="font:500 13px 'IBM Plex Sans',sans-serif;padding:6px 12px;border:0;border-radius:4px;cursor:pointer;background:transparent;color:#2a1f18" style-hover="background:#f1dcc4">{{ v.name }}</button>
      </sc-for>
    </div>
    <div style="display:flex;gap:2px;padding:2px;background:#d9b590;border-radius:6px">
      <button onClick="{{ toggleTex }}" style="font:500 13px 'IBM Plex Sans',sans-serif;padding:6px 12px;border:0;border-radius:4px;cursor:pointer;background:transparent;color:#2a1f18" style-hover="background:#f1dcc4">{{ texLabel }}</button>
      <button onClick="{{ togglePl }}" style="font:500 13px 'IBM Plex Sans',sans-serif;padding:6px 12px;border:0;border-radius:4px;cursor:pointer;background:transparent;color:#2a1f18" style-hover="background:#f1dcc4">{{ plLabel }}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  hostRef = React.createRef();
  state = { n: 0, tex: true, pl: true };

  componentDidMount() {
    const wait = () => (window.THREE && window.BlockKit && window.StudKit && window.ForestKit && window.ForestCorner && window.ClassicKit && window.PlateauDress && window.CoastV2 ? this.init() : setTimeout(wait, 50));
    wait();
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); this.ro && this.ro.disconnect(); this.renderer && this.renderer.dispose(); }

  makeTex(kind) {
    const THREE = window.THREE, c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    g.fillStyle = '#e4e4e4'; g.fillRect(0, 0, 64, 64);
    if (kind === 'Studs') {
      g.fillStyle = '#b8b8b8'; g.beginPath(); g.arc(34, 35, 19, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#ffffff'; g.beginPath(); g.arc(31, 31, 18, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#cfcfcf'; g.lineWidth = 2; g.beginPath(); g.arc(31, 31, 18, 0, Math.PI * 2); g.stroke();
    } else if (kind === 'Inlet') {
      g.fillStyle = '#bdbdbd'; g.fillRect(18, 18, 28, 28);
      g.fillStyle = '#a6a6a6'; g.fillRect(18, 18, 28, 5); g.fillRect(18, 18, 5, 28);
      g.fillStyle = '#f4f4f4'; g.fillRect(18, 44, 28, 2); g.fillRect(44, 18, 2, 28);
    } else {
      g.strokeStyle = '#b4b4b4'; g.lineWidth = 3;
      g.beginPath(); g.moveTo(8, 8); g.lineTo(56, 56); g.moveTo(56, 8); g.lineTo(8, 56); g.stroke();
      g.strokeStyle = '#f6f6f6'; g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(9, 6); g.lineTo(58, 55); g.moveTo(58, 9); g.lineTo(9, 58); g.stroke();
    }
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; t.anisotropy = 4;
    return t;
  }

  async init() {
    const THREE = window.THREE, host = this.hostRef.current;
    try { this.mv = await (await fetch('./src/material-variants.json')).json(); } catch (e) { this.mv = []; }
    try { this.cat = await (await fetch('./src/fullkit-catalog.json')).json(); } catch (e) { this.cat = null; }
    const model = (this.model = window.PlateauDress.build({ cat: this.cat }));
    this.zf = window.BlockKit.zfight(model.parts);
    this.gc = window.BlockKit.gridCheck(model.parts, { skip: ['Props', 'Blockout/Water', 'Terrain/Water'] });
    const renderer = (this.renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }));
    renderer.setPixelRatio(Math.min(2, devicePixelRatio));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    host.appendChild(renderer.domElement);
    renderer.domElement.style.display = 'block';
    const scene = (this.scene = new THREE.Scene());
    scene.background = new THREE.Color('#bcd9ea');
    scene.fog = new THREE.Fog('#bcd9ea', 220, 700);
    scene.add(new THREE.HemisphereLight('#e6f2ff', '#8a7a62', 0.7));
    const sun = new THREE.DirectionalLight('#fff4e0', 1.2);
    sun.position.set(-60, 110, 80);
    sun.castShadow = true;
    sun.shadow.mapSize.set(4096, 4096);
    Object.assign(sun.shadow.camera, { left: -95, right: 95, top: 95, bottom: -95, near: 1, far: 500 });
    sun.shadow.bias = -0.0004;
    scene.add(sun);
    const tex = { Studs: this.makeTex('Studs'), Weld: this.makeTex('Weld'), Inlet: this.makeTex('Inlet') };
    const mat4 = (c) => new THREE.Matrix4().set(c.R[0], c.R[1], c.R[2], c.p[0], c.R[3], c.R[4], c.R[5], c.p[1], c.R[6], c.R[7], c.R[8], c.p[2], 0, 0, 0, 1);
    const mats = {};
    this.texMats = [];
    const matOf = (p) => {
      const k = p.color + p.mat + (p.variant || '');
      if (!mats[k]) {
        const c = new THREE.Color(p.color).convertSRGBToLinear();
        mats[k] = new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, side: THREE.DoubleSide, map: p.variant ? tex[p.variant] : null });
        if (p.variant) this.texMats.push([mats[k], tex[p.variant]]);
      }
      return mats[k];
    };
    const boxGeo = (s, uv) => {
      const g = new THREE.BoxGeometry(s[0], s[1], s[2]);
      if (uv) {
        const a = g.attributes.uv, dims = [[s[2], s[1]], [s[2], s[1]], [s[0], s[2]], [s[0], s[2]], [s[0], s[1]], [s[0], s[1]]];
        for (let f = 0; f < 6; f++) for (let i = 0; i < 4; i++) { const j = f * 4 + i; a.setXY(j, a.getX(j) * dims[f][0], a.getY(j) * dims[f][1]); }
      }
      return g;
    };
    // 5-stud R6 player stand-in (preview only, not exported, not checked)
    const [px, pz, pry, py = 0] = model.player || [20, 0, -90];
    this.pl = window.BlockKit.player([px, py, pz], pry);
    this.eye = [px, pz, pry, py];
    this.sc = window.BlockKit.scaleCheck(model.parts, { doors: model.doors });
    window.__scale = () => this.sc;
    this.plMeshes = [];
    for (const p of model.parts.concat(this.pl)) {
      let geo;
      if (p.cls === 'MeshPart') geo = this.kitGeo(p); // kit mesh stand-in (real mesh can't load here)
      else if (p.cls === 'TrussPart') geo = this.trussGeo(p.size[1]);
      else if (p.cls === 'WedgePart') geo = this.wedgeGeo(...p.size);
      else if (p.shape === 2) { geo = new THREE.CylinderGeometry(p.size[1] / 2, p.size[1] / 2, p.size[0], 20); geo.rotateZ(Math.PI / 2); }
      else if (p.meshKey) geo = this.meshGeo(p);
      else geo = boxGeo(p.size, !!p.variant);
      const mesh = new THREE.Mesh(geo, matOf(p));
      mesh.castShadow = p.shadow; mesh.receiveShadow = true;
      mesh.matrixAutoUpdate = false; mesh.matrix.copy(mat4(p.cf));
      scene.add(mesh);
      if (p.group === 'Scale/Player') this.plMeshes.push(mesh);
    }
    this.cam = new THREE.PerspectiveCamera(35, 1, 0.5, 2000);
    this.orbit = { az: 0.45, el: 0.42, r: 190, target: new THREE.Vector3(0, 6, -10) };
    window.__view = this.orbit;
    this.bindOrbit(renderer.domElement);
    this.ro = new ResizeObserver(() => this.resize());
    this.ro.observe(host);
    this.resize();
    this.setState({ n: model.parts.length });
    const draw = (window.__draw = () => {
      const o = this.orbit, cam = this.cam;
      cam.position.set(o.target.x + o.r * Math.cos(o.el) * Math.sin(o.az), o.target.y + o.r * Math.sin(o.el), o.target.z + o.r * Math.cos(o.el) * Math.cos(o.az));
      cam.lookAt(o.target);
      renderer.render(scene, cam);
    });
    const loop = () => { draw(); this.raf = requestAnimationFrame(loop); };
    loop();
  }

  // stand-ins for Roblox meshes (the real ones can't load here)
  meshGeo(p) {
    const THREE = window.THREE, [sx, sy, sz] = p.size, k = p.meshKey;
    const merge = (list) => { const pos = []; for (const g of list) { const n = g.toNonIndexed(); pos.push(...n.attributes.position.array); } const out = new THREE.BufferGeometry(); out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); out.computeVertexNormals(); return out; };
    const leaf = (len, wid, ang, tilt) => { const g = new THREE.SphereGeometry(1, 8, 6); g.scale(wid / 2, 0.12, len / 2); g.translate(0, 0, len / 2); g.rotateX(-tilt); g.rotateY(ang); return g; };
    if (k === 'Round') {
      const pts = [], r = 0.5, e = 0.14;
      pts.push(new THREE.Vector2(0, -0.5));
      for (let i = 0; i <= 6; i++) { const a = -Math.PI / 2 + (i / 6) * (Math.PI / 2); pts.push(new THREE.Vector2(r - e + Math.cos(a) * e, -0.5 + e + Math.sin(a) * e)); }
      for (let i = 0; i <= 6; i++) { const a = (i / 6) * (Math.PI / 2); pts.push(new THREE.Vector2(r - e + Math.cos(a) * e, 0.5 - e + Math.sin(a) * e)); }
      pts.push(new THREE.Vector2(0, 0.5));
      const g = new THREE.LatheGeometry(pts, 24); g.scale(sx, sy, sz); return g;
    }
    if (k === 'Fern') { const L = []; for (let i = 0; i < 6; i++) L.push(leaf(sx * 0.55, sx * 0.3, (i / 6) * Math.PI * 2 + 0.3, 0.5 + (i % 2) * 0.35)); const g = merge(L); g.translate(0, -sy / 2 + 0.1, 0); return g; }
    if (k === 'Bush') { const L = []; for (let ring = 0; ring < 3; ring++) for (let i = 0; i < 9; i++) L.push(leaf(sx * (0.5 - ring * 0.12), sx * 0.2, (i / 9) * Math.PI * 2 + ring * 0.35, 0.15 + ring * 0.45)); const g = merge(L); g.translate(0, -sy / 2 + 0.3, 0); return g; }
    if (k === 'Ring') { const g = new THREE.TorusGeometry(0.36, 0.13, 8, 20); g.rotateX(Math.PI / 2); g.scale(sx, sy / 0.26, sz); return g; }
    if (k === 'Cloud') { const L = []; for (const [x, y, r] of [[-0.3, 0, 0.32], [0.05, 0.08, 0.4], [0.35, -0.02, 0.3]]) { const g = new THREE.IcosahedronGeometry(r * sx * 0.55, 1); g.translate(x * sx, y * sy, 0); L.push(g); } return merge(L); }
    return new THREE.BoxGeometry(sx, sy, sz);
  }


  // stand-ins for build-kit MeshParts, drawn from the part name and size (the real meshes load in Roblox)
  kitGeo(p) {
    const T = window.THREE, [sx, sy, sz] = p.size, n = p.name;
    const merge = (list) => { const pos = []; for (const g of list) { const q = g.toNonIndexed(); pos.push(...q.attributes.position.array); } const out = new T.BufferGeometry(); out.setAttribute('position', new T.Float32BufferAttribute(pos, 3)); out.computeVertexNormals(); return out; };
    const lathe = (pts) => { const g = new T.LatheGeometry(pts.map(([r, y]) => new T.Vector2(r, y)), 22); g.scale(sx, sy, sz); return g; };
    const bx = (w, h, d, x, y, z) => { const g = new T.BoxGeometry(w, h, d); g.translate(x, y, z); return g; };
    if (n === 'Vase' || n === 'Ceramic_Potion') return lathe([[0, -0.5], [0.2, -0.5], [0.3, -0.45], [0.5, -0.12], [0.46, 0.12], [0.28, 0.3], [0.2, 0.4], [0.3, 0.5], [0.24, 0.5], [0.16, 0.42]]);
    if (n === 'Bowl') return lathe([[0, 0.5], [0.2, 0.5], [0.42, 0.25], [0.5, -0.5], [0.44, -0.5], [0.36, 0], [0, 0.1]]); // the real mesh imports upside-down
    if (n === 'Goblet') return lathe([[0, -0.5], [0.25, -0.5], [0.25, -0.4], [0.08, -0.3], [0.08, 0], [0.3, 0.15], [0.5, 0.5], [0.44, 0.5], [0.25, 0.2], [0, 0.15]]);
    if (n === 'Candle') { const g = new T.CylinderGeometry(0.45, 0.45, 1, 12); g.scale(sx, sy, sz); return g; }
    if (n === 'Bag' || n === 'Grab_Bag' || n === 'Moneybag') { const a = new T.SphereGeometry(0.5, 14, 10); a.scale(sx, sy * 0.85, sz); a.translate(0, -sy * 0.07, 0); const c = new T.CylinderGeometry(0.14 * sx, 0.2 * sx, 0.2 * sy, 10); c.translate(0, sy * 0.42, 0); return merge([a, c]); }
    if (n === 'Apple') { const g = new T.SphereGeometry(0.5, 12, 9); g.scale(sx, sy, sz); return g; }
    if (n === 'Rock') { const g = new T.IcosahedronGeometry(0.5, 1), a = g.attributes.position; for (let i = 0; i < a.count; i++) { const k = 0.82 + 0.3 * Math.abs(Math.sin(a.getX(i) * 9.1 + a.getY(i) * 5.3 + a.getZ(i) * 7.7)); a.setXYZ(i, a.getX(i) * k, a.getY(i) * k * 0.9, a.getZ(i) * k); } g.scale(sx, sy, sz); g.computeVertexNormals(); return g; }
    if (n === 'Mushroom') { const st = new T.CylinderGeometry(0.16, 0.2, 0.6, 8); st.translate(0, -0.2, 0); const cap = new T.SphereGeometry(0.5, 12, 7, 0, Math.PI * 2, 0, Math.PI / 2); cap.translate(0, -0.02, 0); const g = merge([st, cap]); g.scale(sx, sy, sz); return g; }
    if (n === 'Ring') { const g = new T.TorusGeometry(0.37, 0.13, 8, 22); g.scale(sx, sy, sz / 0.26); return g; }
    if (n === 'Broom') { const st = new T.CylinderGeometry(0.05, 0.05, 1, 6); st.rotateX(Math.PI / 2); const br = bx(1, 0.8, 0.28, 0, 0, -0.36); const g = merge([st, br]); g.scale(sx, sy, sz); return g; }
    if (n === 'Moai' || n === 'TikiHead') return (() => { const g = merge([bx(0.95, 1, 0.82, 0, 0, 0.09), bx(1, 0.1, 0.2, 0, 0.22, -0.4), bx(0.2, 0.34, 0.26, 0, -0.04, -0.5), bx(0.2, 0.09, 0.1, -0.22, 0.12, -0.46), bx(0.2, 0.09, 0.1, 0.22, 0.12, -0.46), bx(0.5, 0.08, 0.12, 0, -0.28, -0.46), bx(0.7, 0.1, 0.7, 0, 0.5, 0.1)]); g.scale(sx, sy, sz); return g; })();
    if (n === 'Plant' || n === 'Sprout') return this.meshGeo({ meshKey: 'Fern', size: p.size });
    if (n === 'Sapling' || n === 'Bush') return this.meshGeo({ meshKey: 'Bush', size: p.size });
    if (n === 'Book' || n.startsWith('Symbol_') || n === 'Brazier') return new T.BoxGeometry(sx, sy, sz);
    const g = new T.SphereGeometry(0.5, 14, 10); g.scale(sx, sy, sz); return g;
  }

  // TrussPart stand-in: 4 corner rails + a rung ring every 2 studs (Frame style)
  trussGeo(len) {
    const THREE = window.THREE, list = [], bar = (w, h, d, x, y, z) => { const g = new THREE.BoxGeometry(w, h, d); g.translate(x, y, z); list.push(g.toNonIndexed()); };
    for (const x of [-0.85, 0.85]) for (const z of [-0.85, 0.85]) bar(0.3, len, 0.3, x, 0, z);
    for (let y = -len / 2 + 1; y < len / 2; y += 2) { bar(2, 0.25, 0.25, 0, y, -0.85); bar(2, 0.25, 0.25, 0, y, 0.85); bar(0.25, 0.25, 2, -0.85, y, 0); bar(0.25, 0.25, 2, 0.85, y, 0); }
    const pos = []; for (const g of list) pos.push(...g.attributes.position.array);
    const out = new THREE.BufferGeometry(); out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); out.computeVertexNormals(); return out;
  }

  wedgeGeo(sx, sy, sz) {
    const THREE = window.THREE, x = sx / 2, y = sy / 2, z = sz / 2;
    const v = [[-x, -y, -z], [x, -y, -z], [-x, -y, z], [x, -y, z], [-x, y, z], [x, y, z]];
    const tris = [[0, 2, 1], [1, 2, 3], [2, 4, 3], [3, 4, 5], [0, 1, 4], [1, 5, 4], [0, 4, 2], [1, 3, 5]];
    const pos = [], c = [0, -y / 3, z / 3];
    for (let [a, b, d] of tris) {
      const A = v[a], B = v[b], D = v[d];
      const u = [B[0] - A[0], B[1] - A[1], B[2] - A[2]], w = [D[0] - A[0], D[1] - A[1], D[2] - A[2]];
      const n = [u[1] * w[2] - u[2] * w[1], u[2] * w[0] - u[0] * w[2], u[0] * w[1] - u[1] * w[0]];
      const m = [(A[0] + B[0] + D[0]) / 3 - c[0], (A[1] + B[1] + D[1]) / 3 - c[1], (A[2] + B[2] + D[2]) / 3 - c[2]];
      if (n[0] * m[0] + n[1] * m[1] + n[2] * m[2] < 0) [b, d] = [d, b];
      [a, b, d].forEach((i) => pos.push(...v[i]));
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.computeVertexNormals();
    return g;
  }

  resize() {
    const host = this.hostRef.current;
    if (!host || !this.renderer) return;
    this.renderer.setSize(host.clientWidth, host.clientHeight);
    this.cam.aspect = host.clientWidth / host.clientHeight;
    this.cam.updateProjectionMatrix();
  }

  bindOrbit(el) {
    let drag = null;
    el.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; el.setPointerCapture(e.pointerId); el.style.cursor = 'grabbing'; });
    el.addEventListener('pointermove', (e) => {
      if (!drag) return;
      this.orbit.az -= (e.clientX - drag.x) * 0.006;
      this.orbit.el = Math.max(0.02, Math.min(1.5, this.orbit.el + (e.clientY - drag.y) * 0.005));
      drag.x = e.clientX; drag.y = e.clientY;
    });
    el.addEventListener('pointerup', () => { drag = null; el.style.cursor = 'grab'; });
    el.addEventListener('wheel', (e) => { e.preventDefault(); this.orbit.r = Math.max(8, Math.min(700, this.orbit.r * (1 + e.deltaY * 0.001))); }, { passive: false });
  }

  renderVals() {
    const go = (x, y, z, r, el, az) => () => { const o = this.orbit; if (!o) return; this.cam.fov = 35; this.cam.updateProjectionMatrix(); Object.assign(o, { r, el }); if (az !== undefined) o.az = az; o.target.set(x, y, z); };
    const m = this.model;
    return {
      hostRef: this.hostRef,
      info: m ? `meshes shown as stand-ins · ${m.parts.length} parts · ${m.parts.filter((p) => p.variant).length} with Studs/Weld · z-fighting faces: ${this.zf.length} · scale warnings: ${(this.sc || []).length} · off-grid structure: ${this.gc.length}` : 'loading…',
      views: [
        { name: 'Eye', go: () => { const o = this.orbit, e = this.eye; if (!o || !e) return; const a = e[2] * Math.PI / 180, fx = -Math.sin(a), fz = -Math.cos(a); o.target.set(e[0] + fx * 6.7, (e[3] || 0) + 4.5 - 6 * Math.tan(0.3), e[1] + fz * 6.7); /* camera 0.7 ahead of the face so the body is out of frame */ Object.assign(o, { r: 6 / Math.cos(0.3), el: 0.3, az: Math.atan2(-fx, -fz) }); this.cam.fov = 70; this.cam.updateProjectionMatrix(); } },
        { name: 'Overview', go: go(0, 6, -10, 190, 0.42, 0.45) },
        { name: 'From front', go: go(0, 8, -20, 160, 0.2, 0) },
        { name: 'From west', go: go(-10, 8, -20, 150, 0.22, -1.2) },
        { name: 'From east', go: go(10, 8, -20, 150, 0.22, 1.2) },
        { name: 'Stair 1', go: go(-10, 4, -6, 45, 0.3, 0.5) },
        { name: 'Temple', go: go(0, 26, -40, 120, 0.2, 0.25) },
        { name: 'Temple low', go: go(0, 24, -40, 90, 0.05, 0) },
        { name: 'West shelf', go: go(-42, 6, -30, 60, 0.35, -0.5) },
        { name: 'Statue head', go: go(-3, 8, -21, 26, 0.3, 0.2) },
        { name: 'Temple steps', go: go(0, 22, -38, 36, 0.25, 0.3) },
        { name: 'Grain store', go: go(-28, 22, -38, 30, 0.25, 0.5) },
        { name: 'Back cliffs', go: go(10, 16, -48, 130, 0.2, 0.1) },
        { name: 'East cliffs', go: go(44, 12, -28, 100, 0.25, 1.2) },
        { name: 'Top', go: go(0, 0, -15, 230, 1.5, 0) },
      ],
      texLabel: this.state.tex ? 'Textures: on' : 'Textures: off',
      plLabel: this.state.pl ? 'Player: on' : 'Player: off',
      togglePl: () => { const on = !this.state.pl; (this.plMeshes || []).forEach((m) => (m.visible = on)); this.setState({ pl: on }); },
      toggleTex: () => {
        const on = !this.state.tex;
        (this.texMats || []).forEach(([mt, t]) => { mt.map = on ? t : null; mt.needsUpdate = true; });
        this.setState({ tex: on });
      },
      dl: () => {
        if (!m) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([window.BlockKit.toRbxmx({ ...m, rootXml: this.mv })], { type: 'application/xml' }));
        a.download = 'SandPlateau.rbxmx';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      },
    };
  }
}
</script>
